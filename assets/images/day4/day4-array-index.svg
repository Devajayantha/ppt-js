<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" role="img" aria-labelledby="title desc">
  <title id="title">Array dengan indeks mulai dari nol</title>
  <desc id="desc">Deretan kotak array berisi nilai 80, 75, 90, 85 dengan indeks 0 sampai 3.</desc>
  <rect width="460" height="220" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="16" fill="#637083" font-weight="700">
      <text x="80" y="58">0</text><text x="180" y="58">1</text><text x="280" y="58">2</text><text x="380" y="58">3</text>
    </g>
    <g font-size="28" fill="#17202a" font-weight="800">
      <rect x="35" y="74" width="90" height="74" rx="10" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="80" y="120">80</text>
      <rect x="135" y="74" width="90" height="74" rx="10" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="180" y="120">75</text>
      <rect x="235" y="74" width="90" height="74" rx="10" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="280" y="120">90</text>
      <rect x="335" y="74" width="90" height="74" rx="10" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="380" y="120">85</text>
    </g>
    <text x="230" y="184" font-size="20" font-weight="800" fill="#17202a">daftarNilai[0] = 80</text>
  </g>
</svg>
