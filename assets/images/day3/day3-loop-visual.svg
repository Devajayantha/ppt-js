<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-labelledby="title desc">
  <title id="title">Visual pengulangan angka</title>
  <desc id="desc">Angka 1 sampai 5 ditampilkan berurutan dengan panah kembali.</desc>
  <rect width="420" height="220" rx="18" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="800">
    <path d="M88 152 C120 190, 300 190, 332 152" fill="none" stroke="#2677d9" stroke-width="5"/>
    <path d="M332 152 l-18 4 l8-17" fill="none" stroke="#2677d9" stroke-width="5"/>
    <g font-size="26" fill="#17202a">
      <circle cx="70" cy="88" r="30" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="70" y="97">1</text>
      <circle cx="140" cy="88" r="30" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="140" y="97">2</text>
      <circle cx="210" cy="88" r="30" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="210" y="97">3</text>
      <circle cx="280" cy="88" r="30" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="280" y="97">4</text>
      <circle cx="350" cy="88" r="30" fill="#eaf2ff" stroke="#2677d9" stroke-width="3"/><text x="350" y="97">5</text>
    </g>
  </g>
</svg>
